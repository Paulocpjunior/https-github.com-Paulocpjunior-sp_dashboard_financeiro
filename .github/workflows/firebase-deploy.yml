name: Deploy to Firebase Hosting

on:
  # Push valida, mas nunca publica. Publicação exige autorização por commit.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      approved_commit:
        description: 'SHA completo autorizado por Paulo para publicar'
        required: true
        type: string

concurrency:
  group: financeiro-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Validar funcionalidades financeiras antes de publicar
        run: |
          node scripts/guard-production.mjs --check
          node scripts/test-production-guard.mjs
          npm run lint
          npm run test:firestore-backup
          npm run test:jotform-events
          npm run test:payables-matches
          npm run test:payables-review
          npm run test:itau-statements
          npm run test:financial-permissions
          npm run test:accumulated-balances
          npm run test:billing-confirmation
          npm run test:billing-obligations
          npm run test:checklist-status
          npm run test:billing-completeness
          npm ci --prefix cloud-run/jotform-webhook
          npm test --prefix cloud-run/jotform-webhook
          node cloud-run/jotform-webhook/test-checklist.js
          npm run test:billing-forecast
          npm run test:boleto-cloud
          npm run test:dashboard-duplicates-sorting
          npm run test:data-loading
          npm run test:payment-method

      - name: Preparar Java para testes de regras isolados
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verificar permissões e histórico das conferências
        run: |
          node -e 'require("fs").writeFileSync("/tmp/billing-rules-emulator.json", JSON.stringify({firestore:{rules:process.cwd()+"/firestore.rules"},emulators:{firestore:{port:8080},ui:{enabled:false},singleProjectMode:true}}))'
          npx --yes firebase-tools@14.27.0 emulators:exec --only firestore --project demo-financeiro-reviews --config /tmp/billing-rules-emulator.json "node scripts/test-billing-review-rules.mjs"

      - name: Build do projeto
        env:
          # Gate de departamento em BLOQUEIO (Paulo, 08/08, após teste):
          # app estático — o modo entra no build.
          VITE_DEPARTAMENTO_GATE_MODO: bloqueio
        run: npm run build

      - name: Publicar regras das conferências com preservação e backup
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          FINANCEIRO_APPROVED_COMMIT: '${{ inputs.approved_commit }}'
          GCP_CREDENTIALS: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
        run: |
          pip install google-auth requests
          python scripts/audit-billing-source-readonly.py
          python scripts/publish-billing-review-rules.py

      - name: Preservar backup das regras anteriores
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: regras-antes-conferencia-${{ github.sha }}
          path: rules-backup/
          retention-days: 30

      - name: Deploy no Firebase Hosting
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          FINANCEIRO_APPROVED_COMMIT: '${{ inputs.approved_commit }}'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: gen-lang-client-0888019226

      - name: Fixar a consulta do checklist na revisão implantada
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          FINANCEIRO_APPROVED_COMMIT: '${{ inputs.approved_commit }}'
          GCP_CREDENTIALS: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
        run: |
          pip install google-auth requests
          python scripts/activate-checklist-route.py
