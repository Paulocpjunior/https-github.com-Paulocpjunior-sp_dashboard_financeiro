name: Verificar atualizacao de arquivos Hosting
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare_static_update:
    runs-on: ubuntu-latest
    steps:
      - run: python -m pip install google-auth requests
      - name: Validar copia sem publicar
        env:
          GCP_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python - <<'PY'
          import json, os, time
          from google.oauth2.service_account import Credentials
          from google.auth.transport.requests import AuthorizedSession
          session=AuthorizedSession(Credentials.from_service_account_info(json.loads(os.environ['GCP_CREDENTIALS']),scopes=['https://www.googleapis.com/auth/cloud-platform']))
          api='https://firebasehosting.googleapis.com/v1beta1/'
          site='sites/gen-lang-client-0888019226'
          def request(method,path,**kwargs):
              response=session.request(method,api+path,timeout=30,**kwargs)
              if not response.ok: raise RuntimeError(str(response.status_code)+' '+response.json().get('error',{}).get('message',''))
              return response.json()
          releases=request('GET',site+'/releases',params={'pageSize':1})
          source=releases['releases'][0]['version']['name']
          original=request('GET',source)
          print('ORIGINAL_VERSION:',source)
          operation=request('POST',site+'/versions:clone',json={'sourceVersion':source,'finalize':False})
          for _ in range(30):
              if operation.get('done'):break
              time.sleep(1)
              operation=request('GET',operation['name'])
          if not operation.get('done') or operation.get('error'):raise RuntimeError('Clone não concluiu: '+str(operation.get('error')))
          version=operation['response']['name']
          cloned=request('GET',version)
          assert cloned.get('config')==original.get('config'),'Configuração divergente'
          result=request('PATCH',version,params={'updateMask':'status'},json={'status':'FINALIZED'})
          assert result.get('config')==original.get('config'),'Configuração divergente ao finalizar'
          print('STATIC_CONFIG_PRESERVED_AND_FINALIZED:',result['status'])
          print('Nenhuma release criada. Produção e dados financeiros não alterados.')
          PY
