name: Diagnostico de leitura Firestore
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check_database:
    runs-on: ubuntu-latest
    steps:
      - run: python -m pip install google-auth requests
      - name: Verificar banco e contagens sem alterar dados
        env:
          GCP_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python - <<'PY'
          import json, os
          from google.oauth2.service_account import Credentials
          from google.auth.transport.requests import AuthorizedSession
          credentials = Credentials.from_service_account_info(json.loads(os.environ['GCP_CREDENTIALS']), scopes=['https://www.googleapis.com/auth/cloud-platform'])
          session = AuthorizedSession(credentials)
          project = 'gen-lang-client-0888019226'
          root = 'https://firestore.googleapis.com/v1/projects/' + project + '/databases/(default)'
          response = session.get(root, timeout=30)
          print('DATABASE_HTTP:', response.status_code)
          if response.ok:
              data = response.json()
              print('DATABASE_METADATA:', json.dumps({key: data.get(key) for key in ['name','locationId','type','deleteProtectionState','pointInTimeRecoveryEnablement','earliestVersionTime'] }))
          else: print('DATABASE_ERROR:', response.json().get('error', {}).get('message'))
          for label, collection, start, end in [('ALL_TRANSACTIONS','transactions',None,None),('SEPTEMBER_2026','transactions','2026-09-01','2026-09-30'),('OCTOBER_2026','transactions','2026-10-01','2026-10-31'),('USERS','users',None,None)]:
              query = {'from':[{'collectionId':collection}]}
              if start:
                  query['where']={'compositeFilter':{'op':'AND','filters':[{'fieldFilter':{'field':{'fieldPath':'date'},'op':'GREATER_THAN_OR_EQUAL','value':{'stringValue':start}}},{'fieldFilter':{'field':{'fieldPath':'date'},'op':'LESS_THAN_OR_EQUAL','value':{'stringValue':end}}}]}}
              body={'structuredAggregationQuery':{'structuredQuery':query,'aggregations':[{'alias':'records','count':{}}]}}
              response=session.post(root+'/documents:runAggregationQuery',json=body,timeout=45)
              print(label+'_HTTP:', response.status_code)
              if response.ok:
                  result=response.json()
                  for row in result:
                      if 'result' in row: print(label+'_COUNT:',row['result'].get('aggregateFields',{}).get('records',{}).get('integerValue'))
              else: print(label+'_ERROR:', response.json().get('error',{}).get('message'))
          print('READ_ONLY_DATABASE_CHECK_COMPLETE')
          PY
