name: Deploy to Firebase Hosting

on:
  # Push na main = deploy — mesma cultura dos módulos irmãos. O disparo
  # manual continua disponível. Antes era SÓ manual, e dois merges (gate de
  # departamento em aviso e em bloqueio) ficaram na main sem subir até
  # alguém lembrar de clicar (08/08).
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Build do projeto
        env:
          # Gate de departamento em BLOQUEIO (Paulo, 08/08, após teste):
          # app estático — o modo entra no build.
          VITE_DEPARTAMENTO_GATE_MODO: bloqueio
        run: npm run build

      - name: Deploy no Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: gen-lang-client-0888019226
