name: Diagnóstico de implantação checklist
on:
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - run: pip install google-auth requests
      - name: Verificar permissões e configuração sem expor credenciais
        env:
          GCP_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python - <<'PY'
          import os,json,requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request
          creds=service_account.Credentials.from_service_account_info(json.loads(os.environ["GCP_CREDENTIALS"]),scopes=["https://www.googleapis.com/auth/cloud-platform"])
          creds.refresh(Request())
          headers={"Authorization":"Bearer "+creds.token}
          project="gen-lang-client-0888019226"
          p=requests.post("https://cloudresourcemanager.googleapis.com/v1/projects/"+project+":testIamPermissions",headers=headers,json={"permissions":["run.services.get","run.services.update","run.services.create","cloudbuild.builds.create","storage.buckets.create","artifactregistry.repositories.uploadArtifacts"]},timeout=30)
          print("Deploy permissions:",p.status_code,p.json().get("permissions",[]))
          r=requests.get("https://run.googleapis.com/v1/namespaces/"+project+"/services/jotform-webhook",headers=headers,timeout=30)
          print("Service lookup:",r.status_code)
          if r.status_code==200:
           d=r.json()
           print("Region:",d.get("metadata",{}).get("labels",{}).get("cloud.googleapis.com/location"))
           print("Service URL:",d.get("status",{}).get("url"))
           spec=d.get("spec",{}).get("template",{}).get("spec",{})
           print("Runtime identity:",spec.get("serviceAccountName"))
           print("Image:",spec.get("containers",[{}])[0].get("image"))
           print("Jotform credential binding exists:",any(e.get("name")=="JOTFORM_API_KEY" for e in spec.get("containers",[{}])[0].get("env",[])))
          
          PY
